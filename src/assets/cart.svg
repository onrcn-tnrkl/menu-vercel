<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Arka kart (turuncu) -->
  <g transform="rotate(7 64 64)">
    <rect x="16" y="24" width="98" height="68" rx="10" fill="#E8944A"/>
    <rect x="16" y="24" width="98" height="14" rx="7" fill="#D97F34"/>
  </g>

  <!-- On kart (krem) -->
  <g transform="rotate(-8 64 66)">
    <rect x="14" y="32" width="100" height="70" rx="10" fill="#FBF1DC" stroke="#E3CFA8" stroke-width="2"/>

    <!-- 3x3 delikler -->
    <g fill="#EBD9B8" stroke="#D9C198" stroke-width="1.5">
      <circle cx="38" cy="50" r="7.5"/><circle cx="64" cy="50" r="7.5"/><circle cx="90" cy="50" r="7.5"/>
      <circle cx="38" cy="67" r="7.5"/><circle cx="64" cy="67" r="7.5"/><circle cx="90" cy="67" r="7.5"/>
      <circle cx="38" cy="84" r="7.5"/><circle cx="64" cy="84" r="7.5"/><circle cx="90" cy="84" r="7.5"/>
    </g>

    <!-- Yaprak (sag alt) -->
    <g transform="translate(112 100) rotate(-135)">
      <path d="M0 0 C 8 -12 24 -12 32 -4 C 24 8 8 10 0 0 Z" fill="#6B7F4E"/>
      <path d="M2 0 C 12 -2 22 -4 30 -4" stroke="#FBF1DC" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Yaprak (sol ust) -->
    <g transform="translate(14 36) rotate(-45)">
      <path d="M0 0 C 6 -9 18 -9 24 -3 C 18 6 6 8 0 0 Z" fill="#6B7F4E"/>
      <path d="M2 0 C 10 -2 17 -3 22 -3" stroke="#FBF1DC" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Kahve cekirdegi (sol alt) -->
    <g transform="translate(24 96) rotate(-25)">
      <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#C8662B"/>
      <path d="M-8 0 C -3 -3 3 3 8 0" stroke="#FBF1DC" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
